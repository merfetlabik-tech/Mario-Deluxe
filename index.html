<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mario Deluxe - 50 Levels</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Arial}
body{display:flex;align-items:center;justify-content:center}
.wrap{position:relative;width:min(100vw,960px);height:min(100vh,540px);aspect-ratio:16/9;background:#6ec6ff;overflow:hidden}
canvas{width:100%;height:100%;display:block}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(#10264add,#07101eee);color:white;text-align:center;z-index:5}
.hide{display:none!important}
.title{font-size:clamp(35px,7vw,68px);font-weight:900;margin:0 0 8px}
.sub{font-size:17px;margin:0 0 18px}
.btn{border:0;border-radius:14px;padding:13px 24px;margin:5px;background:white;color:#17202a;font-size:18px;font-weight:800}
.levels{width:90%;max-height:230px;overflow:auto;display:grid;grid-template-columns:repeat(10,1fr);gap:7px;padding:8px}
.lv{padding:9px 2px;border:0;border-radius:9px;font-weight:bold}
.hud{position:absolute;left:10px;right:10px;top:8px;display:flex;justify-content:space-between;color:white;font-weight:bold;font-size:16px;text-shadow:0 2px 3px #000;z-index:3}
.hud span{background:#0007;padding:6px 9px;border-radius:9px}
.controls{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:space-between;padding:0 14px;z-index:4}
.group{display:flex;gap:10px}
.ctrl{width:65px;height:65px;border:0;border-radius:50%;background:#ffffffaa;font-size:28px;font-weight:bold}
</style>
</head>
<body>
<div class="wrap">
<canvas id="game" width="960" height="540"></canvas>

<div id="menu" class="screen">
<div>5 عوالم • 50 مرحلة</div>
<h1 class="title">Mario Deluxe</h1>
<p class="sub">مغامرة منصات ممتعة 🎮</p>
<button id="start" class="btn">ابدأ اللعب</button>
<button id="sound" class="btn">🔊 الصوت</button>
<div id="levels" class="levels"></div>
</div>

<div class="hud">
<span id="levelText">المرحلة 1</span>
<span id="score">⭐ 0</span>
</div>

<div class="controls">
<div class="group">
<button class="ctrl" id="left">◀</button>
<button class="ctrl" id="right">▶</button>
</div>
<div class="group">
<button class="ctrl" id="jump">⬆</button>
</div>
</div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let level=1,score=0,running=false;
let keys={left:false,right:false};
let player={x:80,y:400,w:35,h:45,vx:0,vy:0,onGround:false};
let coins=[];
let blocks=[];
let enemies=[];
let goal={x:900,y:430,w:35,h:70};

function makeLevel(){
 coins=[];blocks=[];enemies=[];
 for(let i=0;i<8;i++){
   coins.push({x:150+i*95,y:300-(i%3)*55,r:10});
 }
 for(let i=0;i<7;i++){
   blocks.push({x:100+i*125,y:470,w:100,h:70});
 }
 for(let i=0;i<3;i++){
   enemies.push({x:300+i*210,y:425,w:32,h:32,vx:1.3});
 }
 player={x:55,y:390,w:35,h:45,vx:0,vy:0,onGround:false};
 goal={x:900,y:400,w:25,h:100};
 document.getElementById("levelText").textContent="المرحلة "+level;
}

function draw(){
 ctx.clearRect(0,0,960,540);

 let sky=ctx.createLinearGradient(0,0,0,540);
 sky.addColorStop(0,"#55c7ff");
 sky.addColorStop(1,"#dff7ff");
 ctx.fillStyle=sky;ctx.fillRect(0,0,960,540);

 ctx.fillStyle="#74c365";
 for(let i=0;i<12;i++){
   ctx.beginPath();
   ctx.arc(i*100+40,430,80,Math.PI,0);
   ctx.fill();
 }

 blocks.forEach(b=>{
   ctx.fillStyle="#8b5a2b";
   ctx.fillRect(b.x,b.y,b.w,b.h);
   ctx.fillStyle="#55a832";
   ctx.fillRect(b.x,b.y,b.w,10);
 });

 coins.forEach(c=>{
   ctx.fillStyle="#ffd43b";
   ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,Math.PI*2);ctx.fill();
 });

 enemies.forEach(e=>{
   ctx.fillStyle="#8b1e1e";
   ctx.fillRect(e.x,e.y,e.w,e.h);
   ctx.fillStyle="#fff";
   ctx.fillRect(e.x+6,e.y+7,7,7);
   ctx.fillRect(e.x+20,e.y+7,7,7);
 });

 ctx.fillStyle="#fff";
 ctx.fillRect(goal.x,goal.y,5,100);
 ctx.fillStyle="#e63946";
 ctx.fillRect(goal.x+5,goal.y,45,28);

 ctx.fillStyle="#e63946";
 ctx.fillRect(player.x,player.y,player.w,player.h);
 ctx.fillStyle="#ffd1a9";
 ctx.fillRect(player.x+8,player.y+8,19,18);
 ctx.fillStyle="#5b2c83";
 ctx.fillRect(player.x+4,player.y,27,9);
}

function update(){
 if(!running)return;

 player.vx=0;
 if(keys.left)player.vx=-4;
 if(keys.right)player.vx=4;

 player.vy+=0.55;
 player.x+=player.vx;
 player.y+=player.vy;

 player.onGround=false;

 blocks.forEach(b=>{
   if(player.x< b.x+b.w &&
      player.x+player.w>b.x &&
      player.y+player.h>b.y &&
      player.y+player.h-player.vy<=b.y){
     player.y=b.y-player.h;
     player.vy=0;
     player.onGround=true;
   }
 });

 if(player.x<0)player.x=0;
 if(player.x>925)player.x=925;
 if(player.y>540){
   makeLevel();
 }

 coins=coins.filter(c=>{
   let hit=player.x<c.x+10&&player.x+player.w>c.x-10&&
           player.y<c.y+10&&player.y+player.h>c.y-10;
   if(hit){score++;document.getElementById("score").textContent="⭐ "+score}
   return !hit;
 });

 enemies.forEach(e=>{
   e.x+=e.vx;
   if(e.x<150||e.x>850)e.vx*=-1;
   if(player.x<e.x+e.w&&player.x+player.w>e.x&&
      player.y<e.y+e.h&&player.y+player.h>e.y){
     makeLevel();
   }
 });

 if(player.x+player.w>goal.x){
   if(level<50){
     level++;
     makeLevel();
   }else{
     running=false;
     document.getElementById("menu").classList.remove("hide");
     document.querySelector(".sub").textContent="🎉 مبروك! خلصت جميع المراحل!";
   }
 }
}

function loop(){
 update();
 draw();
 requestAnimationFrame(loop);
}

function jump(){
 if(player.onGround){
   player.vy=-11;
 }
}

document.getElementById("start").onclick=()=>{
 running=true;
 document.getElementById("menu").classList.add("hide");
 makeLevel();
};

document.getElementById("left").onpointerdown=()=>keys.left=true;
document.getElementById("left").onpointerup=()=>keys.left=false;
document.getElementById("left").onpointerleave=()=>keys.left=false;

document.getElementById("right").onpointerdown=()=>keys.right=true;
document.getElementById("right").onpointerup=()=>keys.right=false;
document.getElementById("right").onpointerleave=()=>keys.right=false;

document.getElementById("jump").onpointerdown=jump;

document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft")keys.left=true;
 if(e.key==="ArrowRight")keys.right=true;
 if(e.key===" "||e.key==="ArrowUp")jump();
});

document.addEventListener("keyup",e=>{
 if(e.key==="ArrowLeft")keys.left=false;
 if(e.key==="ArrowRight")keys.right=false;
});

for(let i=1;i<=50;i++){
 let b=document.createElement("button");
 b.className="lv";
 b.textContent=i;
 b.onclick=()=>{
   level=i;
   running=true;
   document.getElementById("menu").classList.add("hide");
   makeLevel();
 };
 document.getElementById("levels").appendChild(b);
}

makeLevel();
loop();
</script>
</body>
</html>
